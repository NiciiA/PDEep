[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdeep-research"
version = "0.1.0"
description = "Validated foundations for PDE inverse reconstruction research"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2", "numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8",
  "pytest>=8", "notebook>=7", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
